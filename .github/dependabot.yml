# Dependabot version updates. Every version in this repository is pinned exactly, so without
# this file the pins only age. Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# (checked 2026-09-23; pnpm lockfiles are handled by the `npm` ecosystem).
#
# Weekly, and grouped: one pull request per ecosystem for every minor and patch bump, while a
# major bump comes alone, because it is the one most likely to need code changes.
#
# A Dependabot pull request goes through the same CI as any other, so `just check` still
# decides:
#
# - A new Rust or npm dependency version must pass `just deny` or `just web-licences`.
# - The dev image's base (docker/dev/Dockerfile) is also pinned in rust-toolchain.toml. A
#   bump of one alone fails `just pins` until the other is moved in the same pull request.
# - The node, just and cargo-deny downloads in the Dockerfile are ARG plus SHA-256 pins that
#   Dependabot cannot see. They are bumped by hand, with the Rust toolchain, and each ARG's
#   comment names where its SHA-256 was checked.
#
# Advisory alerts are a repository setting (Dependabot alerts), not part of this file.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker/dev
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
