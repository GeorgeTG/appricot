# The exact BUILD toolchain, so the dev container, CI and any other host build identically.
# An exact version, not a channel: a toolchain that moves on its own turns an unrelated edit
# into a red gate, and the day it happens is never the day you have to spare.
#
# This is not the MSRV. `rust-version = "1.91"` in Cargo.toml is the declared floor, the promise
# to a host application that builds these crates in its own workspace. `just msrv` (a CI job)
# keeps it: it reads that rust-version and runs `cargo +<version> check --workspace --all-targets
# --all-features --locked`, which bypasses this file on purpose. Raising the floor moves
# Cargo.toml and this comment together.
#
# The dev image's base (docker/dev/Dockerfile) carries this same version; `just pins` fails when
# the two differ.
[toolchain]
channel = "1.94.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
