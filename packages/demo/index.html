<!doctype html>
<!--
  The APPricot demo host page.

  Runs under a strict CSP with no 'unsafe-inline' and no 'unsafe-eval' in script-src
  (ADR-0003 §3), so: no inline styles, no inline scripts, no inline event handlers — the
  stylesheet is external, the page's script is external, and all wiring happens through
  addEventListener in src/main.ts. Not even an import map: Chromium applies script-src to
  inline import maps (measured 2026-09-21 — a plain 'self' policy blocks the map and no
  page script runs), so the server rewrites the page modules' one bare specifier,
  '@app-ricot/client', to the /client/index.js URL it serves (see src/server.ts).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>APPricot demo</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/dist/main.js"></script>
  </head>
  <body>
    <!-- The toolbar: everything here is host chrome. The token INPUT field is the only
         source of the stream token — it is never read from the URL or the query string. -->
    <header id="toolbar">
      <span class="brand">APPricot</span>
      <span class="url" id="session-url">ws://…/session</span>
      <label class="field">
        Token
        <input id="token" type="password" autocomplete="off" spellcheck="false" />
      </label>
      <button id="connect" type="button">Connect</button>
      <button id="close" type="button" disabled>Close</button>
      <label class="field toggle">
        <input id="reconnect" type="checkbox" />
        Reconnect
      </label>
      <!-- Paste is opt-in (ADR-0003 §7): off by default. Checked, the text of a paste into a
           streamed window is sent to the streamed app; unchecked, it stays in this page. -->
      <label class="field toggle" title="Pasted text leaves this page for the streamed app">
        <input id="paste" type="checkbox" />
        Send pasted text to the app
      </label>
      <!-- The other clipboard direction (ADR-0003 §7): a copy made in the streamed app
           reaches this page as an event and is held as data — nothing is written anywhere
           until this button, a real user gesture and the only writer of the user's
           clipboard, says so. Disabled while nothing is held. -->
      <button id="copy-app-text" type="button" disabled>Copy app text</button>
      <!-- Minimized windows: one restore button per hidden window, its label the window's
           own title — untrusted server text, written by src/main.ts through setTextOnly
           (ADR-0003 §1), never markup. Empty (nothing minimized) it renders nothing. -->
      <span id="minimized" class="minimized-strip"></span>
      <span class="status">
        <span id="status">idle</span>
        <span id="session-id"></span>
        <span id="windows-count"></span>
      </span>
    </header>

    <!-- One floating window per streamed toplevel is appended here by src/main.ts. -->
    <main id="windows"></main>
  </body>
</html>
